apiVersion: apps/v1
kind: Deployment
metadata:
  name: comptia-lernplattform
  namespace: apps
  labels:
    app.kubernetes.io/name: comptia-lernplattform
    app.kubernetes.io/part-of: homelab-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comptia-lernplattform
  template:
    metadata:
      labels:
        app: comptia-lernplattform
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: app
          image: ghcr.io/miaucetung/comptia-lernplattform:main
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
