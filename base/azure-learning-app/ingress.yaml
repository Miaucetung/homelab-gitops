apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: azure-learning-app
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: azure.ajti.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: azure-learning-app
                port:
                  number: 80
